version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mm3_musica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mm3_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm3_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mm3_musica_db}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_banco_dados.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm3_admin} -d ${POSTGRES_DB:-mm3_musica_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
